<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ML Radar</title>
<style>
:root{
  --bg:#fbfbf9; --panel:#fff; --ink:#191918; --dim:#71716b; --faint:#9b9b94;
  --line:#e6e6e1; --accent:#2c6b4f; --warn:#8a5a00; --bad:#a33; --chip:#f2f2ed;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518; --panel:#1c1d21; --ink:#eaeae6; --dim:#9d9d96; --faint:#75756e;
  --line:#2c2d32; --accent:#7fc9a3; --warn:#d9a441; --bad:#e07070; --chip:#25262b;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:inherit}
header{padding:16px 22px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
.meta{color:var(--dim);font-size:12px;margin-top:2px}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-size:12px;padding:4px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--faint)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
#panel{display:none;padding:12px 22px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#panel.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px 16px}
.grid label{display:flex;gap:8px;align-items:baseline;padding:4px 0;cursor:pointer;font-size:13px}
.grid input{margin:0;flex:none;position:relative;top:1px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  font-weight:650;margin:14px 0 5px;grid-column:1/-1}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:940px){main{grid-template-columns:1fr}}
section{padding:16px 22px 40px;min-width:0}
section+section{border-left:1px solid var(--line)}
@media(max-width:940px){section+section{border-left:0;border-top:1px solid var(--line)}}
h2{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  font-weight:650;display:flex;justify-content:space-between;align-items:baseline}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  margin-bottom:12px;overflow:hidden}
.card>h3{margin:0;font-size:12.5px;font-weight:650;padding:9px 12px;cursor:pointer;
  display:flex;gap:8px;align-items:center;background:var(--panel)}
.card>h3 .n{color:var(--faint);font-weight:400}
.card>h3 .caret{margin-left:auto;color:var(--faint);font-size:10px}
.card ul{border-top:1px solid var(--line)}
.card.shut ul{display:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:11px;padding:11px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li:hover{background:var(--chip)}
.thumb{flex:none;width:84px;height:56px;border-radius:5px;object-fit:cover;
  background:var(--chip);display:block}
.thumb.p{width:104px;height:66px}
.body{min-width:0;flex:1}
.t{display:block;text-decoration:none;font-weight:550;font-size:14.5px;line-height:1.4;
  letter-spacing:-.005em}
.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.ex{color:var(--dim);font-size:13px;line-height:1.5;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--faint);font-size:12px;margin-top:5px;display:flex;gap:7px;
  flex-wrap:wrap;align-items:center}
.src{color:var(--accent);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.chip{background:var(--chip);border-radius:4px;padding:1px 6px;font-size:11.5px;color:var(--dim)}
a.chip{text-decoration:none}
a.chip:hover{border-color:var(--faint);color:var(--ink)}
.up{font-variant-numeric:tabular-nums}
.stale{color:var(--warn);font-size:11px;font-weight:650}
.dead{color:var(--bad);font-size:11px;font-weight:650}
.empty{color:var(--faint);padding:11px 12px;font-size:12.5px}
#err{padding:12px 22px;color:var(--bad);font-size:12.5px}
body.noimg .thumb{display:none}
</style>
</head>
<body>
<header>
  <h1>ML Radar</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div class="bar">
    <button id="btnPanel">소스 <span id="cnt"></span></button>
    <span class="sep"></span>
    <button id="btnGroup" class="on">소스별</button>
    <button id="btnTime">시간순</button>
    <span class="sep"></span>
    <button id="btnImg" class="on">이미지</button>
    <button id="btnEx" class="on">요약</button>
    <span class="meta" id="warn"></span>
  </div>
</header>
<div id="panel"><div class="grid" id="toggles"></div>
  <div class="bar"><button id="allOn">전체 켜기</button><button id="allOff">전체 끄기</button></div>
</div>
<div id="err"></div>
<main>
  <section><h2><span>논문 · 최근 7일</span><span id="pn"></span></h2><div id="papers"></div></section>
  <section><h2><span>글 · 최근 30일</span><span id="an"></span></h2><div id="arts"></div></section>
</main>

<script>
const PAPER_DAYS=7, ARTICLE_DAYS=30, TIME_CAP=5;
const GROUPS={newsletter:"뉴스레터",lab:"랩 · 연구",eng:"엔지니어링",papers:"논문"};
const K={off:"mlradar.off",shut:"mlradar.shut",view:"mlradar.view",img:"mlradar.img",ex:"mlradar.ex"};

const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let off=new Set(lsGet(K.off,[])), shut=new Set(lsGet(K.shut,[]));
let view=lsGet(K.view,"group"), showImg=lsGet(K.img,true), showEx=lsGet(K.ex,true);

const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const age=iso=>{const d=new Date(iso);return isNaN(d)?null:Math.floor((Date.now()-d)/864e5)};
const fmt=iso=>{const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${String(d.getDate()).padStart(2,"0")}`};
const within=(iso,n)=>{const a=age(iso);return a!==null&&a<=n};
const byDate=(a,b)=>(b.date||"").localeCompare(a.date||"");

let STATUS=null, PAPERS=[], FEEDS={};
const getJSON=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()};

async function boot(){
  try{ STATUS=await getJSON("data/status.json?t="+Date.now()); }
  catch(e){
    document.getElementById("err").textContent=
      "status.json을 읽지 못했습니다. 아직 수집이 한 번도 돌지 않았을 수 있습니다. ("+e.message+")";
    document.getElementById("meta").textContent=""; return;
  }
  const v="?v="+encodeURIComponent(STATUS.generated_at||"");
  await Promise.all(STATUS.sources.map(async s=>{
    if(s.slug==="hf_papers"){ try{PAPERS=(await getJSON("data/papers.json"+v)).items||[]}catch{PAPERS=[]} }
    else{ try{FEEDS[s.slug]=(await getJSON("data/feeds/"+s.slug+".json"+v)).items||[]}catch{FEEDS[s.slug]=[]} }
  }));
  buildToggles(); applyModes(); render();
}

function staleBadge(s){
  if(s.ok) return "";
  const d=s.stale_days;
  if(d==null) return `<span class="dead">한 번도 성공 못함</span>`;
  return `<span class="${d>=7?"dead":"stale"}">${d}일째 갱신 없음</span>`;
}

function buildToggles(){
  const box=document.getElementById("toggles"), order=["papers","newsletter","lab","eng"], byG={};
  STATUS.sources.forEach(s=>(byG[s.group]||=[]).push(s));
  box.innerHTML=order.filter(g=>byG[g]).map(g=>
    `<div class="grp">${GROUPS[g]||g}</div>`+byG[g].map(s=>`
      <label><input type="checkbox" data-slug="${s.slug}" ${off.has(s.slug)?"":"checked"}>
      <span>${esc(s.name)} <span class="chip">${s.n_items}</span> ${staleBadge(s)}</span></label>`).join("")
  ).join("");
  box.querySelectorAll("input").forEach(i=>i.onchange=()=>{
    i.checked?off.delete(i.dataset.slug):off.add(i.dataset.slug);
    lsSet(K.off,[...off]); render();
  });
  document.getElementById("allOn").onclick=()=>{off.clear();lsSet(K.off,[]);buildToggles();render()};
  document.getElementById("allOff").onclick=()=>{
    off=new Set(STATUS.sources.map(s=>s.slug));lsSet(K.off,[...off]);buildToggles();render()};
}

const thumb=(u,cls)=> (showImg&&u)
  ? `<img class="thumb ${cls||''}" src="${esc(u)}" loading="lazy" decoding="async"
       referrerpolicy="no-referrer" alt="">` : "";

// hide any thumbnail whose remote file has disappeared, so the row still reads fine
function guardImages(root){
  root.querySelectorAll("img.thumb").forEach(im=>{
    im.addEventListener("error",()=>{im.style.display="none"},{once:true});
    if(im.complete && im.naturalWidth===0) im.style.display="none";
  });
}

function paperLI(p){
  const L=p.linked||{}, c=[];
  c.push(`<span class="chip up">▲ ${p.upvotes}</span>`);
  c.push(`<a class="chip" href="${esc(p.arxiv)}" target="_blank" rel="noopener">arXiv</a>`);
  if(p.github) c.push(`<a class="chip" href="${esc(p.github)}" target="_blank" rel="noopener">code</a>`);
  if(L.models)   c.push(`<span class="chip" title="${esc((L.top_models||[]).join(", "))}">모델 ${L.models}</span>`);
  if(L.datasets) c.push(`<span class="chip" title="${esc((L.top_datasets||[]).join(", "))}">데이터셋 ${L.datasets}</span>`);
  const au=(p.authors||[]).slice(0,2).join(", ")+(p.n_authors>2?` 외 ${p.n_authors-2}명`:"");
  return `<li>${thumb(p.thumb,"p")}<div class="body">
    <a class="t" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>
    ${showEx&&p.summary?`<div class="ex">${esc(p.summary)}</div>`:""}
    <div class="sub"><span>${fmt(p.date)}</span><span>${esc(au)}</span>${c.join("")}</div></div></li>`;
}

function artLI(it,src){
  return `<li>${thumb(it.image)}<div class="body">
    <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
    ${showEx&&it.summary?`<div class="ex">${esc(it.summary)}</div>`:""}
    <div class="sub">${src?`<span class="src">${esc(src)}</span>`:""}<span>${fmt(it.date)}</span></div>
    </div></li>`;
}

function card(id,title,count,badge,inner){
  const s=shut.has(id);
  return `<div class="card ${s?"shut":""}" data-card="${id}">
    <h3><span>${esc(title)}</span><span class="n">${count}</span>${badge}
        <span class="caret">${s?"▸":"▾"}</span></h3><ul>${inner}</ul></div>`;
}

function render(){
  const st=Object.fromEntries(STATUS.sources.map(s=>[s.slug,s]));
  const pbox=document.getElementById("papers");
  if(off.has("hf_papers")){
    pbox.innerHTML=`<div class="empty">HF Daily Papers가 꺼져 있습니다.</div>`;
    document.getElementById("pn").textContent="";
  }else{
    const ps=PAPERS.filter(p=>within(p.date,PAPER_DAYS))
                   .sort((a,b)=>byDate(a,b)||b.upvotes-a.upvotes);
    document.getElementById("pn").textContent=ps.length+"편";
    pbox.innerHTML=ps.length
      ? card("hf_papers","Hugging Face Daily Papers",ps.length+"편",staleBadge(st.hf_papers),ps.map(paperLI).join(""))
      : `<div class="empty">최근 ${PAPER_DAYS}일 논문이 없습니다. ${staleBadge(st.hf_papers)}</div>`;
  }

  const live=STATUS.sources.filter(s=>s.slug!=="hf_papers"&&!off.has(s.slug));
  const abox=document.getElementById("arts"); let total=0;
  if(view==="time"){
    let rows=[];
    live.forEach(s=>{
      const its=(FEEDS[s.slug]||[]).filter(i=>within(i.date,ARTICLE_DAYS)).sort(byDate);
      total+=its.length;
      its.slice(0,TIME_CAP).forEach(i=>rows.push({...i,_src:s.name}));
    });
    rows.sort(byDate);
    abox.innerHTML=rows.length
      ? `<div class="card"><ul>${rows.map(r=>artLI(r,r._src)).join("")}</ul></div>
         <div class="empty">소스당 최근 ${TIME_CAP}건까지 · 30일 내 전체 ${total}건</div>`
      : `<div class="empty">표시할 글이 없습니다.</div>`;
  }else{
    let html="";
    ["newsletter","lab","eng"].forEach(g=>{
      const inG=live.filter(s=>s.group===g);
      if(!inG.length) return;
      html+=`<div class="grp" style="margin:16px 0 7px">${GROUPS[g]}</div>`;
      inG.forEach(s=>{
        const its=(FEEDS[s.slug]||[]).filter(i=>within(i.date,ARTICLE_DAYS)).sort(byDate);
        total+=its.length;
        html+=card(s.slug,s.name,its.length+"건",staleBadge(st[s.slug]),
          its.length?its.map(i=>artLI(i,null)).join("")
                    :`<li><div class="empty" style="padding:0">최근 ${ARTICLE_DAYS}일 글 없음</div></li>`);
      });
    });
    abox.innerHTML=html||`<div class="empty">모든 소스가 꺼져 있습니다.</div>`;
  }
  document.getElementById("an").textContent=total+"건";

  document.querySelectorAll("[data-card] > h3").forEach(h=>h.onclick=()=>{
    const id=h.parentElement.dataset.card;
    shut.has(id)?shut.delete(id):shut.add(id);
    lsSet(K.shut,[...shut]); render();
  });

  const bad=STATUS.sources.filter(s=>!s.ok);
  document.getElementById("warn").innerHTML=bad.length?`<span class="stale">${bad.length}개 소스 갱신 실패</span>`:"";
  const g=STATUS.generated_at?new Date(STATUS.generated_at):null;
  document.getElementById("meta").textContent=
    (g?`마지막 수집 ${g.toLocaleString("ko-KR")}`:"")+
    ` · 소스 ${STATUS.sources.length}개 중 ${STATUS.sources.filter(s=>s.ok).length}개 정상`;
  document.getElementById("cnt").textContent=`${STATUS.sources.length-off.size}/${STATUS.sources.length}`;
  guardImages(document);
}

function applyModes(){
  document.body.classList.toggle("noimg",!showImg);
  document.getElementById("btnImg").classList.toggle("on",showImg);
  document.getElementById("btnEx").classList.toggle("on",showEx);
  document.getElementById("btnGroup").classList.toggle("on",view==="group");
  document.getElementById("btnTime").classList.toggle("on",view==="time");
}
document.getElementById("btnPanel").onclick=()=>document.getElementById("panel").classList.toggle("open");
document.getElementById("btnGroup").onclick=()=>{view="group";lsSet(K.view,view);applyModes();render()};
document.getElementById("btnTime").onclick =()=>{view="time"; lsSet(K.view,view);applyModes();render()};
document.getElementById("btnImg").onclick  =()=>{showImg=!showImg;lsSet(K.img,showImg);applyModes();render()};
document.getElementById("btnEx").onclick   =()=>{showEx=!showEx;  lsSet(K.ex,showEx); applyModes();render()};
boot();
</script>
</body>
</html>
